<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">SCP-0404 / Quarentena audiovisual</title><desc id="desc">O clone fica preso no hospedeiro; nenhuma rota para outras câmeras.. Esquema conceitual fictício, sem escala. Os cinco pontos numerados correspondem à legenda.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#213641" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#dfb96c" stroke-width="2"/></marker></defs><rect width="1200" height="800" fill="#101d25"/><rect width="750" height="800" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="14" fill="#dfb96c">FUNDAÇÃO RESENHA / ARQUITETURA DE CONTENÇÃO</text><text x="40" y="87" font-size="30" fill="#eef5ef">SCP-0404 / Quarentena audiovisual</text><text x="40" y="118" font-size="16" fill="#c6d9dd">O clone fica preso no hospedeiro; nenhuma rota para outras câmeras.</text><path d="M40 140H1160" stroke="#48636d"/><rect x="65" y="175" width="240" height="190" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="205" font-size="16" fill="#80cad0">POSTO EXTERNO</text><rect x="365" y="175" width="340" height="365" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="381" y="205" font-size="16" fill="#80cad0">CÂMARA SEM REDE</text><rect x="65" y="425" width="240" height="270" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="455" font-size="16" fill="#80cad0">ANTESSALA DE SERVIÇO</text><rect x="365" y="590" width="340" height="105" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="381" y="620" font-size="16" fill="#80cad0">REGISTRO FÍSICO</text><rect x="410" y="260" width="245" height="160" rx="8" fill="#152a32" stroke="#ea8f89" stroke-width="3"/><text x="426" y="290" font-size="16" fill="#ea8f89">TERMINAL HOSPEDEIRO</text><text x="435" y="331" font-size="18" fill="#ea8f89">SCP-0404 / CLONE</text><text x="438" y="374" font-size="18" fill="#c6d9dd">LOOP FECHADO</text><text x="390" y="490" font-size="16" fill="#c6d9dd">SEM CÂMERAS CONECTADAS</text><text x="390" y="650" font-size="18" fill="#c6d9dd">Hora • estado • assinatura</text><text x="87" y="245" font-size="17" fill="#c6d9dd">LEITURA ÓPTICA</text><text x="87" y="280" font-size="14" fill="#c6d9dd">SEM RETORNO DE SINAL</text><text x="87" y="488" font-size="16" fill="#c6d9dd">SEM DISPOSITIVOS</text><text x="87" y="520" font-size="15" fill="#c6d9dd">DE CAPTURA PESSOAIS</text><text x="87" y="625" font-size="15" fill="#c6d9dd">Alimentação independente</text><path d="M410 320H320V280H305" fill="none" stroke="#dfb96c" stroke-width="3" marker-end="url(#arrow)"/><path d="M305 620H330V520H365" fill="none" stroke="#80cad0" stroke-width="2" stroke-dasharray="7 5"/><path d="M350 155V555" stroke="#ea8f89" stroke-width="4" stroke-dasharray="10 8"/><circle cx="675" cy="230" r="18" fill="#dfb96c"/><text x="675" y="236" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">1</text><circle cx="675" cy="395" r="18" fill="#dfb96c"/><text x="675" y="401" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">2</text><circle cx="280" cy="325" r="18" fill="#dfb96c"/><text x="280" y="331" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">3</text><circle cx="280" cy="550" r="18" fill="#dfb96c"/><text x="280" y="556" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">4</text><circle cx="675" cy="650" r="18" fill="#dfb96c"/><text x="675" y="656" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">5</text><path d="M760 160V715" stroke="#48636d"/><circle cx="795" cy="185" r="18" fill="#dfb96c"/><text x="795" y="191" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">1</text><text x="826" y="190" font-size="19" fill="#eef5ef">Isolamento de sinal</text><text x="782" y="224" font-size="16" fill="#c6d9dd">Sem ligação com a rede da Fundação.</text><text x="782" y="247" font-size="16" fill="#c6d9dd">O vídeo não alcança outro dispositivo.</text><circle cx="795" cy="289" r="18" fill="#dfb96c"/><text x="795" y="295" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">2</text><text x="826" y="294" font-size="19" fill="#eef5ef">Loop de quadros</text><text x="782" y="328" font-size="16" fill="#c6d9dd">Âncora anômala mantém o hospedeiro.</text><text x="782" y="351" font-size="16" fill="#c6d9dd">Recurso fictício exclusivo deste SCP.</text><circle cx="795" cy="393" r="18" fill="#dfb96c"/><text x="795" y="399" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">3</text><text x="826" y="398" font-size="19" fill="#eef5ef">Observação externa</text><text x="782" y="432" font-size="16" fill="#c6d9dd">Leitura óptica sem câmera de retorno.</text><text x="782" y="455" font-size="16" fill="#c6d9dd">Sem rostos novos enviados ao clone.</text><circle cx="795" cy="497" r="18" fill="#dfb96c"/><text x="795" y="503" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">4</text><text x="826" y="502" font-size="19" fill="#eef5ef">Antessala controlada</text><text x="782" y="536" font-size="16" fill="#c6d9dd">Sem celulares ou câmeras pessoais.</text><text x="782" y="559" font-size="16" fill="#c6d9dd">Manutenção por equipe autorizada.</text><circle cx="795" cy="601" r="18" fill="#dfb96c"/><text x="795" y="607" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">5</text><text x="826" y="606" font-size="19" fill="#eef5ef">Registros físicos</text><text x="782" y="640" font-size="16" fill="#c6d9dd">Ordens e estados conferidos fora.</text><text x="782" y="663" font-size="16" fill="#c6d9dd">A voz da tela não libera a contenção.</text><text x="40" y="752" font-size="15" fill="#dfb96c">ESQUEMA FICTÍCIO • SEM ESCALA • leia os limites e protocolos no dossiê</text><text x="40" y="779" font-size="14" fill="#c6d9dd">A barreira física organiza o espaço; o protocolo específico sustenta a contenção.</text></g></svg>