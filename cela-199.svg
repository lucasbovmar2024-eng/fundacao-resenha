<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">SCP-199 / Recinto residencial compartilhado</title><desc id="desc">Planta sem escala com convivência, pista para A, garagem para B, sala de C e acesso discreto. Quartos e pátio ficam dentro de um limite opaco de sigilo.</desc>
<rect width="1200" height="800" fill="#121d22"/><g font-family="Arial" fill="#e8e8dd"><text x="40" y="54" font-size="29">R-199 / Três instâncias, um recinto confortável</text><text x="40" y="90" font-size="17">SAFE · circulação interna · saídas autorizadas · esquema fictício sem escala</text>
<rect x="45" y="125" width="710" height="580" rx="15" fill="#24343b" stroke="#a4b7b4" stroke-width="6"/>
<rect x="75" y="155" width="285" height="185" rx="10" fill="#3d4141" stroke="#dfbb7c" stroke-width="2"/><text x="95" y="185" font-size="19">01 / Convivência</text><rect x="96" y="212" width="95" height="65" rx="10" fill="#7e665e"/><rect x="220" y="212" width="95" height="65" rx="10" fill="#7e665e"/><circle cx="205" cy="285" r="18" fill="#b29a6a"/><text x="95" y="320" font-size="16">Quartos · água · descanso</text>
<rect x="385" y="155" width="340" height="185" rx="10" fill="#344b3b" stroke="#9ab785" stroke-width="2"/><rect x="410" y="200" width="290" height="95" rx="45" fill="none" stroke="#c3b993" stroke-width="19"/><text x="420" y="185" font-size="19">02 / Pista reservada de A</text><text x="455" y="252" font-size="16">Pátio e exercício</text>
<rect x="75" y="375" width="285" height="195" rx="10" fill="#2b3d4b" stroke="#8eaec0" stroke-width="2"/><text x="95" y="405" font-size="19">03 / Garagem de B</text><rect x="128" y="440" width="177" height="75" rx="10" fill="#1b272e" stroke="#8eaec0" stroke-width="2"/><circle cx="157" cy="520" r="12" fill="#8eaec0"/><circle cx="277" cy="520" r="12" fill="#8eaec0"/><text x="95" y="552" font-size="16">Transformação parado</text>
<rect x="385" y="375" width="340" height="195" rx="10" fill="#483f41" stroke="#cba5ac" stroke-width="2"/><text x="405" y="405" font-size="19">04 / Sala de C</text><ellipse cx="555" cy="478" rx="82" ry="44" fill="#896d6d"/><text x="460" y="550" font-size="16">Conversa e charadas</text>
<rect x="75" y="600" width="650" height="75" rx="8" fill="#233039" stroke="#dfbb7c" stroke-width="2"/><text x="95" y="631" font-size="19">05 / Acesso de serviço e conferência</text><text x="95" y="657" font-size="16">Limite opaco de sigilo · retorno registrado</text>
<g stroke="#dfbb7c" stroke-width="2" fill="none"><path d="M360 170 H775 V165 H800"/><path d="M725 230 H775 V265 H800"/><path d="M360 425 H765 V365 H800"/><path d="M725 475 H775 V465 H800"/><path d="M725 635 H775 V565 H800"/></g>
<g font-size="19" fill="#dfbb7c"><text x="815" y="171">01 / Casa e cuidados</text><text x="815" y="271">02 / Corrida sem pedestres</text><text x="815" y="371">03 / Uso logístico autorizado</text><text x="815" y="471">04 / Só C conversa</text><text x="815" y="571">05 / Preservar o segredo</text></g>
<text x="40" y="755" font-size="17">Conforto não depende de resolver enigmas. Safe não autoriza passeio público.</text></g></svg>
