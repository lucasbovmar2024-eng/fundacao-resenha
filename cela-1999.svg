<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">SCP-1999 / Unidade de verificação</title><desc id="desc">Conter a persuasão sem transformar confiança em credencial.. Esquema conceitual fictício, sem escala. Os cinco pontos numerados correspondem à legenda.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#213641" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#dfb96c" stroke-width="2"/></marker></defs><rect width="1200" height="800" fill="#101d25"/><rect width="750" height="800" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="14" fill="#dfb96c">FUNDAÇÃO RESENHA / ARQUITETURA DE CONTENÇÃO</text><text x="40" y="87" font-size="30" fill="#eef5ef">SCP-1999 / Unidade de verificação</text><text x="40" y="118" font-size="16" fill="#c6d9dd">Conter a persuasão sem transformar confiança em credencial.</text><path d="M40 140H1160" stroke="#48636d"/><rect x="65" y="175" width="240" height="180" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="205" font-size="16" fill="#80cad0">CHECAGEM DUPLA</text><rect x="365" y="175" width="340" height="320" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="381" y="205" font-size="16" fill="#80cad0">ÁREA DE CONVIVÊNCIA</text><rect x="65" y="410" width="240" height="285" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="440" font-size="16" fill="#80cad0">POSTO DE OBSERVAÇÃO</text><rect x="365" y="550" width="340" height="145" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="381" y="580" font-size="16" fill="#80cad0">ARQUIVO ISOLADO / 1999-S</text><rect x="410" y="265" width="245" height="100" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="426" y="295" font-size="16" fill="#80cad0">MESA DE ENTREVISTA</text><text x="426" y="328" font-size="14" fill="#c6d9dd">PERGUNTAS CONCRETAS</text><text x="88" y="258" font-size="14" fill="#c6d9dd">REGISTRO A + REGISTRO B</text><text x="88" y="291" font-size="14" fill="#c6d9dd">SEM AUTOAPROVAÇÃO</text><text x="390" y="620" font-size="18" fill="#c6d9dd">Cópias independentes</text><text x="390" y="650" font-size="15" fill="#c6d9dd">e registros físicos de referência</text><path d="M305 265H350" fill="none" stroke="#dfb96c" stroke-width="3" marker-end="url(#arrow)"/><path d="M390 405H330V480H305 M680 405H730V630H705" fill="none" stroke="#80cad0" stroke-width="2" stroke-dasharray="7 5"/><circle cx="278" cy="320" r="18" fill="#dfb96c"/><text x="278" y="326" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">1</text><circle cx="655" cy="335" r="18" fill="#dfb96c"/><text x="655" y="341" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">2</text><circle cx="675" cy="455" r="18" fill="#dfb96c"/><text x="675" y="461" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">3</text><circle cx="675" cy="650" r="18" fill="#dfb96c"/><text x="675" y="656" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">4</text><circle cx="275" cy="540" r="18" fill="#dfb96c"/><text x="275" y="546" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">5</text><text x="88" y="473" font-size="17" fill="#c6d9dd">OBSERVADOR A</text><text x="88" y="580" font-size="17" fill="#c6d9dd">OBSERVADOR B</text><text x="88" y="636" font-size="15" fill="#c6d9dd">Confirmar antes de abrir.</text><path d="M760 160V715" stroke="#48636d"/><circle cx="795" cy="185" r="18" fill="#dfb96c"/><text x="795" y="191" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">1</text><text x="826" y="190" font-size="19" fill="#eef5ef">Acesso conferido</text><text x="782" y="224" font-size="16" fill="#c6d9dd">Dois funcionários checam a ordem.</text><text x="782" y="247" font-size="16" fill="#c6d9dd">Larper não valida a própria autorização.</text><circle cx="795" cy="289" r="18" fill="#dfb96c"/><text x="795" y="295" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">2</text><text x="826" y="294" font-size="19" fill="#eef5ef">Entrevistas limitadas</text><text x="782" y="328" font-size="16" fill="#c6d9dd">Exemplo concreto e tempo definido.</text><text x="782" y="351" font-size="16" fill="#c6d9dd">Conversa não concede cargo nem acesso.</text><circle cx="795" cy="393" r="18" fill="#dfb96c"/><text x="795" y="399" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">3</text><text x="826" y="398" font-size="19" fill="#eef5ef">Sem privilégios</text><text x="782" y="432" font-size="16" fill="#c6d9dd">Sem terminal administrativo.</text><text x="782" y="455" font-size="16" fill="#c6d9dd">O contato recreativo é supervisionado.</text><circle cx="795" cy="497" r="18" fill="#dfb96c"/><text x="795" y="503" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">4</text><text x="826" y="502" font-size="19" fill="#eef5ef">Manifestação 1999-S</text><text x="782" y="536" font-size="16" fill="#c6d9dd">Guardar cópias em meios isolados.</text><text x="782" y="559" font-size="16" fill="#c6d9dd">Não discutir identidade nem provocar.</text><circle cx="795" cy="601" r="18" fill="#dfb96c"/><text x="795" y="607" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">5</text><text x="826" y="606" font-size="19" fill="#eef5ef">Dois observadores</text><text x="782" y="640" font-size="16" fill="#c6d9dd">Dispositivos independentes na sala.</text><text x="782" y="663" font-size="16" fill="#c6d9dd">Registro auxilia; não garante imunidade.</text><text x="40" y="752" font-size="15" fill="#dfb96c">ESQUEMA FICTÍCIO • SEM ESCALA • leia os limites e protocolos no dossiê</text><text x="40" y="779" font-size="14" fill="#c6d9dd">A barreira física organiza o espaço; o protocolo específico sustenta a contenção.</text></g></svg>