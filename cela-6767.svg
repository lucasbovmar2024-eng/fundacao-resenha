<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">SCP-6767 / Câmara alimentar</title><desc id="desc">Conter a fome por rotina e distração; aço sozinho não resolve.. Esquema conceitual fictício, sem escala. Os cinco pontos numerados correspondem à legenda.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#213641" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#dfb96c" stroke-width="2"/></marker></defs><rect width="1200" height="800" fill="#101d25"/><rect width="750" height="800" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="14" fill="#dfb96c">FUNDAÇÃO RESENHA / ARQUITETURA DE CONTENÇÃO</text><text x="40" y="87" font-size="30" fill="#eef5ef">SCP-6767 / Câmara alimentar</text><text x="40" y="118" font-size="16" fill="#c6d9dd">Conter a fome por rotina e distração; aço sozinho não resolve.</text><path d="M40 140H1160" stroke="#48636d"/><rect x="65" y="175" width="245" height="160" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="205" font-size="16" fill="#80cad0">COZINHA / SEM ACESSO</text><rect x="355" y="175" width="350" height="315" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="371" y="205" font-size="16" fill="#80cad0">CÂMARA ALIMENTAR</text><rect x="65" y="380" width="245" height="110" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="410" font-size="16" fill="#80cad0">RESERVA DE EMERGÊNCIA</text><rect x="65" y="545" width="245" height="145" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="81" y="575" font-size="16" fill="#80cad0">POSTO DE CONTROLE</text><rect x="355" y="545" width="350" height="145" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="371" y="575" font-size="16" fill="#80cad0">PERÍMETRO DO BANQUETE</text><rect x="405" y="265" width="240" height="110" rx="8" fill="#152a32" stroke="#80cad0" stroke-width="3"/><text x="421" y="295" font-size="16" fill="#80cad0">MESA DO KANECOMUS</text><text x="430" y="330" font-size="14" fill="#c6d9dd">REPOSIÇÃO CONTÍNUA</text><text x="390" y="455" font-size="15" fill="#dfb96c">SAÍDA / AVISO DE COBRANÇA</text><path d="M310 275H390 M190 490V520H370V385H405" fill="none" stroke="#dfb96c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M310 620H335V525H530V545" fill="none" stroke="#80cad0" stroke-width="2" stroke-dasharray="6 5"/><circle cx="330" cy="275" r="18" fill="#dfb96c"/><text x="330" y="281" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">1</text><circle cx="280" cy="425" r="18" fill="#dfb96c"/><text x="280" y="431" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">2</text><circle cx="665" cy="455" r="18" fill="#dfb96c"/><text x="665" y="461" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">3</text><circle cx="675" cy="630" r="18" fill="#dfb96c"/><text x="675" y="636" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">4</text><circle cx="280" cy="650" r="18" fill="#dfb96c"/><text x="280" y="656" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">5</text><text x="385" y="615" font-size="16" fill="#c6d9dd">Se a mesa surgir: afastamento,</text><text x="385" y="644" font-size="16" fill="#c6d9dd">observação e nenhum convite.</text><path d="M760 160V715" stroke="#48636d"/><circle cx="795" cy="185" r="18" fill="#dfb96c"/><text x="795" y="191" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">1</text><text x="826" y="190" font-size="19" fill="#eef5ef">Reposição contínua</text><text x="782" y="224" font-size="16" fill="#c6d9dd">Comida chega por área de apoio.</text><text x="782" y="247" font-size="16" fill="#c6d9dd">Evita intervalos no abastecimento.</text><circle cx="795" cy="289" r="18" fill="#dfb96c"/><text x="795" y="295" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">2</text><text x="826" y="294" font-size="19" fill="#eef5ef">Duas reservas</text><text x="782" y="328" font-size="16" fill="#c6d9dd">Geladeiras de emergência prontas.</text><text x="782" y="351" font-size="16" fill="#c6d9dd">Mantêm a rotina se o carrinho falhar.</text><circle cx="795" cy="393" r="18" fill="#dfb96c"/><text x="795" y="399" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">3</text><text x="826" y="398" font-size="19" fill="#eef5ef">Saída monitorada</text><text x="782" y="432" font-size="16" fill="#c6d9dd">Cobrança fictícia como distração.</text><text x="782" y="455" font-size="16" fill="#c6d9dd">É recurso temporário, pode falhar.</text><circle cx="795" cy="497" r="18" fill="#dfb96c"/><text x="795" y="503" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">4</text><text x="826" y="502" font-size="19" fill="#eef5ef">Evento Banquete</text><text x="782" y="536" font-size="16" fill="#c6d9dd">Perímetro de afastamento previsto.</text><text x="782" y="559" font-size="16" fill="#c6d9dd">Sem brindes, pedidos ou novos lugares.</text><circle cx="795" cy="601" r="18" fill="#dfb96c"/><text x="795" y="607" text-anchor="middle" fill="#111d24" font-size="19" font-weight="bold">5</text><text x="826" y="606" font-size="19" fill="#eef5ef">Posto externo</text><text x="782" y="640" font-size="16" fill="#c6d9dd">Bovas define o protocolo.</text><text x="782" y="663" font-size="16" fill="#c6d9dd">Guarnição acompanha o perímetro.</text><text x="40" y="752" font-size="15" fill="#dfb96c">ESQUEMA FICTÍCIO • SEM ESCALA • leia os limites e protocolos no dossiê</text><text x="40" y="779" font-size="14" fill="#c6d9dd">A barreira física organiza o espaço; o protocolo específico sustenta a contenção.</text></g></svg>